name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download game files
        shell: python
        run: |
          import json, pathlib, urllib.request, concurrent.futures
          base = "https://xiaohe-campus-safety-day.siqing25507741.chatgpt.site/"
          paths = json.loads(pathlib.Path("game-files.json").read_text())
          def download(p):
              target = pathlib.Path("game") / p
              target.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(base + p, timeout=90) as response:
                  data = response.read()
                  if not data: raise RuntimeError("Empty resource: " + p)
                  if p.endswith((".png", ".jpg", ".mp3", ".mp4")) and b"<html" in data[:200].lower():
                      raise RuntimeError("Unexpected login page: " + p)
                  target.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(download, paths))
          pathlib.Path("game/.nojekyll").touch()
      - name: Preserve game in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game
          git diff --cached --quiet || git commit -m "Save complete playable game"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
